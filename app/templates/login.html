<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | Ali Raza Enterprises ERP</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #10151d;
      color: #f2f5f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #263746 0%, #10151d 65%);
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 34px;
      border: 1px solid #394653;
      border-radius: 18px;
      background: #171f29;
      box-shadow: 0 24px 70px #0006;
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand img { width: 86px; height: 86px; object-fit: contain; }
    .bismillah { margin: 12px 0; color: #d7c18b; font-size: 20px; }
    h1 { margin: 8px 0; font-size: 24px; }
    .subtitle { color: #aebbc8; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #465463;
      border-radius: 9px;
      background: #0f151c;
      color: #fff;
      font: inherit;
    }
    input:focus { outline: 2px solid #b89a57; outline-offset: 2px; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #b89a57;
      color: #15191e;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #d0b575; }
    .error {
      padding: 10px 12px;
      border: 1px solid #854c4c;
      border-radius: 8px;
      background: #3b2226;
      color: #ffdada;
      font-size: 14px;
    }
    .footer {
      margin-top: 22px;
      color: #9aa8b5;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <header class="brand">
      <img src="/static/ali-raza-logo-hd.png" alt="Ali Raza Enterprises logo">
      <div class="bismillah" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <h1>Ali Raza Enterprises</h1>
      <div class="subtitle">Enterprise Resource Planning</div>
    </header>

    {% if error %}
      <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text"
             maxlength="200" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             maxlength="1024" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>

    <div class="footer">Local ERP system · Authorized users only</div>
  </main>
</body>
</html>
