/* Enhanced dashboard 3D effects */
#are-control-room .ar-card {
  transform: perspective(1100px) translateZ(0);
  transform-style: preserve-3d;
  transition: transform .38s cubic-bezier(.2,.8,.2,1), box-shadow .38s ease;
  will-change: transform;
}
#are-control-room .ar-card:hover {
  transform: perspective(1100px) rotateX(8deg) rotateY(-7deg) translateY(-12px) translateZ(18px);
  box-shadow: 0 14px 0 rgba(19,40,61,.10), 0 32px 52px rgba(19,40,61,.28);
}
#are-control-room .ar-module {
  transform: perspective(1000px) translateZ(0);
  transform-style: preserve-3d;
  transition: transform .38s cubic-bezier(.2,.8,.2,1), box-shadow .38s ease, border-color .38s ease;
  will-change: transform;
}
#are-control-room .ar-module:hover {
  transform: perspective(1000px) rotateX(7deg) rotateY(-7deg) translateY(-11px) translateZ(16px);
  box-shadow: 0 12px 0 rgba(19,40,61,.13), 0 30px 44px rgba(19,39,59,.26);
  border-color: var(--accent);
}
#are-control-room .ar-logo {
  transform-origin: center;
  transform-style: preserve-3d;
  backface-visibility: visible;
  animation: are-logo-spin 6s linear infinite;
  filter: drop-shadow(0 9px 12px rgba(15,35,55,.32));
}
@keyframes are-logo-spin {
  from { transform: perspective(700px) rotateY(0deg); }
  to   { transform: perspective(700px) rotateY(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  #are-control-room .ar-card,
  #are-control-room .ar-module { transition: none; }
  #are-control-room .ar-logo { animation: none; }
}

/* COMBINED CONCEPT: perspective tilt + neon control room + isometric stock + cube launcher */
#are-control-room{--bg:#070b15;--surface:#101829;--surface2:#151f33;--ink:#edf5ff;--muted:#9aaec8;--line:#263751;--accent:#27d9f2;--accent2:#ffbf47;--navy:#090f20;background:radial-gradient(ellipse at 85% 0%,#17284b 0,transparent 42%),linear-gradient(145deg,#070b15,#0b1425 62%,#080d19);color:var(--ink);border:1px solid #24334e;box-shadow:0 30px 80px #0008;position:relative;isolation:isolate}
#are-control-room:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.14;background-image:linear-gradient(#6c8caf22 1px,transparent 1px),linear-gradient(90deg,#6c8caf22 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 78%)}
#are-control-room .ar-header{background:linear-gradient(115deg,#101a30,#112f48 58%,#09202e);border:1px solid #2b4967;box-shadow:0 7px 0 #030712,0 0 30px #16cce51a,0 22px 40px #0007;transform:perspective(1400px) rotateX(1.2deg)}
#are-control-room .ar-bismillah{color:#54e8f5;text-shadow:0 0 20px #27d9f255}
#are-control-room .ar-card,#are-control-room .ar-module{background:linear-gradient(145deg,#17243a,#0e1728);border-color:#2a3e59;box-shadow:0 6px 0 #050914,0 18px 28px #0006;}
#are-control-room .ar-kpi{border-top:2px solid var(--accent);}
#are-control-room .ar-kpi-icon{background:#173849;color:#4de9ff;box-shadow:inset 0 0 18px #20d9f21a}
#are-control-room .ar-eyebrow{color:#45e6fa}#are-control-room .ar-tag{background:#123444;color:#65efff;border:1px solid #24536a}
#are-control-room .ar-panel{background:linear-gradient(145deg,#111c30,#0b1322)}
#are-control-room .ar-chart-empty{background:#0c1526;border-color:#30445f;color:#a6bad2}#are-control-room .ar-chart-empty span{color:#edf5ff}
#are-control-room .ar-module{position:relative;overflow:visible;min-height:142px;padding-top:18px}
#are-control-room .ar-module-icon{position:relative;width:43px;height:39px;border-radius:4px;background:linear-gradient(135deg,#71e8ff 0 30%,#25b9e9 31% 65%,#1673ba 66%);color:#071527;box-shadow:7px 7px 0 #0a527d,0 0 22px #24d8f333;transform:perspective(400px) rotateY(-18deg) rotateX(8deg);}
#are-control-room .ar-module:nth-child(3n+2) .ar-module-icon{background:linear-gradient(135deg,#d8b6ff 0 30%,#a17cff 31% 65%,#7044d7 66%);box-shadow:7px 7px 0 #4b2c98,0 0 22px #a17cff33}
#are-control-room .ar-module:nth-child(3n) .ar-module-icon{background:linear-gradient(135deg,#ffb6de 0 30%,#f05da8 31% 65%,#b52b78 66%);box-shadow:7px 7px 0 #7e1d55,0 0 22px #f05da833}
#are-control-room .ar-module:hover{border-color:#42e7fa;box-shadow:0 8px 0 #050914,0 0 0 1px #42e7fa44,0 25px 44px #0009;transform:perspective(1000px) rotateX(8deg) rotateY(-8deg) translateY(-10px) translateZ(14px)}
#are-control-room .ar-assistant{background:linear-gradient(115deg,#102c3d,#101829 70%);border-color:#28728a;box-shadow:0 0 0 1px #25d9f222,0 0 25px #24d8f21a,0 8px 0 #050914}
#are-control-room .ar-ask-form input{background:#080f1d;border-color:#2d4964;color:#f1f7ff}#are-control-room .ar-button{background:linear-gradient(135deg,#20cde7,#1684c5);color:#04111d;box-shadow:0 4px 0 #07547b}
#are-control-room .ar-prompt{background:#101c2e;border-color:#2c435f;color:#b9cee3}
#are-control-room .ar-table th{background:#17243a;color:#9fb5ce}#are-control-room .ar-table td{color:#eaf3ff}
